pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
rootProject.name = 'dungeon-delving'

// Our other mods in development, built from source and loaded in dev runs, so one runClient tests them all together.
// They live in the pack repository (checked out next to this one); missing ones are skipped. See siblingMods in
// build.gradle.
['deep-mines'].each { name ->
    if (file("../dungeon-delving-pack/${name}").isDirectory()) {
        includeBuild("../dungeon-delving-pack/${name}")
    }
}
