pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
rootProject.name = 'dungeon-delving'

// Our other mods in development (checked out next to this repository), built from source and loaded in dev runs, so
// one runClient tests them all together. Missing ones are skipped. See siblingMods in build.gradle.
['deep-mines'].each { name ->
    if (file("../${name}").isDirectory()) {
        includeBuild("../${name}")
    }
}
