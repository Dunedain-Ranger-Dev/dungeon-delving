pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
rootProject.name = 'dungeon-delving'

// Our other mods in development, built from source next to this repository (missing ones are skipped), and loaded in
// dev runs and game tests. See siblingMods in build.gradle. The whole pack runs from the pack repository's dev project.
['deep-mines', 'professions-and-skills'].each { name ->
    if (file("../${name}").isDirectory()) {
        includeBuild("../${name}")
    }
}
