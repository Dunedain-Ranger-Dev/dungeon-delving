        localRuntime "maven.modrinth:kubejs:THIGFPwf"                // 2101.7.2-build.377
        localRuntime "maven.modrinth:rhino:cQ4POTah"                 // 2101.2.7-build.85
        localRuntime "maven.modrinth:better-advanced-tooltips:uPFbnD32" // 2101.1.0-build.5
        // JEI, to look up recipes while testing
        localRuntime "maven.modrinth:jei:ufHUqt9b"                   // 19.51.0.418
        // FTB Quests and its libraries, for the pack's quest book
        localRuntime "dev.ftb.mods:ftb-quests-neoforge:2101.1.36"
        localRuntime "dev.ftb.mods:ftb-library-neoforge:2101.1.37"
