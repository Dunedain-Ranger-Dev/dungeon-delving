        localRuntime "curse.maven:kubejs-238086:8843626"                // 2101.7.2-build.377
        localRuntime "curse.maven:rhino-416294:8218748"                 // 2101.2.7-build.85
        localRuntime "curse.maven:better-advanced-tooltips-1637623:8576077" // 2101.1.0-build.5
        // JEI, to look up recipes while testing
        localRuntime "curse.maven:jei-238222:8792638"                   // 19.51.0.418
