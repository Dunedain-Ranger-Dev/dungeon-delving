    // localRuntime keeps them out of this mod's published dependencies: Dungeon Delving doesn't require any.
    // Versions are pinned to CurseForge file IDs for NeoForge 1.21.1, the same as the pack's pack.json. They're left out of runData, because
    // Apotheosis's own data generators need its optional Gateways mod.
    if (!gradle.startParameter.taskNames.any { it.toLowerCase().contains('rundata') }) {
